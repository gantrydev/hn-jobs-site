name: CI

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read

env:
  DATA_BASE_URL: https://data.hn-job-trends.gantryops.dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: true

      - name: Use latest data
        env:
          DATA_BRANCH: ${{ github.event.client_payload.data_branch || github.ref_name }}
          DATA_SHA: ${{ github.event.client_payload.data_sha }}
        run: |
          git -C hn-jobs-data remote set-url origin https://github.com/gantrydev/hn-jobs-data.git
          if [ -n "$DATA_SHA" ]; then
            git -C hn-jobs-data fetch --depth=1 origin "$DATA_SHA"
          elif git -C hn-jobs-data ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git -C hn-jobs-data fetch --depth=1 origin "$DATA_BRANCH"
          else
            git -C hn-jobs-data fetch --depth=1 origin main
          fi
          git -C hn-jobs-data checkout --detach FETCH_HEAD
          git -C hn-jobs-data log --oneline -1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Audit
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build
        env:
          DATA_BASE_URL: ${{ env.DATA_BASE_URL }}
          NEXT_PUBLIC_DATA_BASE_URL: ${{ env.DATA_BASE_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ./out

  deploy:
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
